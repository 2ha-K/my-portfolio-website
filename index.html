    <h3><i>留言</i>板</h3>
    <form action="">
        <label for="name">姓名:</label>
        <input type="text" id="name" name="name" required>
        <br>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br>
        <label for="message">留言內容:</label>
        <textarea id="message" name="message" rows="4" cols="50" required></textarea>
        <br>
        <label for="date">日期:</label>
        <input type="date" id="date" name="date" required>
        <br>
        <select id="rating" name="rating" required>
            <option value="">請選擇評分</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
        </select>
        <br>
        <label for="like">喜歡:</label>
        <input type="radio" id="like" name="like" value="like">
        <label for="dislike">不喜歡:</label>
        <input type="radio" id="dislike" name="like" value="dislike">
        <br>
        <label for="subscribe">訂閱最新消息:</label>
        <input type="checkbox" id="subscribe" name="subscribe" value="subscribe">
        <br>
        <input type="submit" value="送出">
    </form>

<!DOCTYPE html> 
<html lang="en">
<head>
    <title>我的學習筆記</title>
    <!-- css是在html中用來美化網頁的語言，之中的style是用來寫css的標籤，在head中使用style標籤可以讓整個網頁都套用css的樣式，若是想要只套用在某個標籤上，可以在該標籤中使用style屬性，並在裡面寫css的語法 -->
    <style>
        table, th, td {
            border: 1px solid black;
        }
    </style>
</head>
<body>
    <h1>上課筆記</h1>
    <h2>!DOCTYPE html</h2>
    <p>!DOCTYPE html的驚嘆號是最新版的意思</p>
    <!-- 這是一個空格 -->
    <br>
    <h2>lorem</h2>
    <p>lorem是生成假文的意思</p>
    <h2>->&nbsp;這是可以多個的空格<-</h2>
    <h2>有序列表</h2>
    <ol>
        <li>第一個</li>
        <li>第二個</li>
        <li>第三個</li>
    </ol>
    <h2>無序列表</h2>
    <ul>
        <li>第一個</li>
        <li>第二個</li>
        <li>第三個</li>
    </ul>
    <h2>表格</h2>
    <table>
        <tr>
            <th>姓名</th>
            <th>年齡</th>
            <th>性別</th>
        </tr>
        <tr>
            <td>小明</td>
            <td>18</td>
            <td>男</td>
        </tr>
        <tr>
            <td>小華</td>
            <td>20</td>
            <td>女</td>
        </tr>
    </table>
    <h2>超連結</h2>

</body>
</html>
